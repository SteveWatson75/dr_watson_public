name: OpenCode comments

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  # These apply only to the built-in GITHUB_TOKEN. The workflow overrides
  # GITHUB_TOKEN with a repo-scoped PAT that has read+write access.
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: opencode-comment-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      github.event.sender.login == github.repository_owner &&
      (startsWith(github.event.comment.body, '/opencode') ||
       github.event.comment.body == '/oc' ||
       startsWith(github.event.comment.body, '/oc '))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DR_WATSON_MODE: github-action
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.OPENCODE_GH_TOKEN }}
          persist-credentials: true

      - uses: ./.github/actions/start-dr-watson
        with:
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}

      - name: Handle the owner request
        uses: anomalyco/opencode/github@e3c4eb242585dcd77be1a867391b7c25fd47ce52 # v1.19.3
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCODE_GH_TOKEN }}
          OPENCODE_CONFIG_CONTENT: >-
            {"provider":{"dr-watson":{"npm":"@ai-sdk/openai-compatible","name":"Dr Watson","options":{"baseURL":"http://127.0.0.1:8787/v1"},"models":{"dr-watson-auto":{"name":"Dr Watson Auto","compatibility":{"reasoningField":"reasoning_content"}}}}}}
          GIT_AUTHOR_NAME: Dr Watson
          GIT_AUTHOR_EMAIL: dr-watson@users.noreply.github.com
          GIT_COMMITTER_NAME: Dr Watson
          GIT_COMMITTER_EMAIL: dr-watson@users.noreply.github.com
        with:
          model: dr-watson/dr-watson-auto
          use_github_token: true
          prompt: |
            Respond to the following owner comment on
            ${{ github.event.issue.html_url || github.event.pull_request.html_url }}.

            Comment:
            ${{ github.event.comment.body }}

            Read the relevant issue/PR context and any files needed to address the specific
            request. Do not perform open-ended research beyond what is needed for this comment.
            If the request asks for code changes, follow existing patterns, add or update tests,
            and run `npm run typecheck` and `npm test`. Keep the response concise and actionable.
