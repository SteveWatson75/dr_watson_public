name: Agent review

# Run ONLY trusted base-branch code. Never check out or execute the PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: agent-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      !github.event.pull_request.draft &&
      github.repository == 'SteveWatson75/dr_watson_public' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install trusted base dependencies (no lifecycle hooks)
        run: npm ci --ignore-scripts
      - name: Prepare exact-commit context (read-only GitHub token)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node_modules/.bin/tsx src/github/github-review-cli.ts collect "$PR_NUMBER" "$REVIEW_SHA" "$BASE_SHA"
      - name: Install pinned OpenCode client
        run: npm install --global @opencode/cli@2.0.30
      - name: Bounded OpenCode → Dr Watson → Go review
        timeout-minutes: 3
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LLM_PROVIDER: auto
          LLM_MONTHLY_SOFT_LIMIT_USD: "0"
          LLM_MONTHLY_HARD_LIMIT_USD: "0"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node_modules/.bin/tsx src/github/github-review-cli.ts analyze "$PR_NUMBER" "$REVIEW_SHA"
      - name: Retain validated result only (no prompt or provider logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-review-result
          path: ${{ runner.temp }}/dr-watson-review/result.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    # Deliberately retire the old "publish" check name: it must not silently
    # become a passing security gate when publication succeeds but review does not.
    name: review-execution
    needs: analyze
    if: always() && needs.analyze.result != 'skipped' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: write
    outputs:
      approved: ${{ steps.verdict.outputs.approved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        continue-on-error: true # Missing artifact must publish Incomplete, never approval.
        with:
          name: bounded-review-result
          path: ${{ runner.temp }}/dr-watson-review
      - name: Validate, recheck SHA, publish advisory verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node_modules/.bin/tsx src/github/github-review-cli.ts publish "$PR_NUMBER" "$REVIEW_SHA"

  review-integrity:
    # Non-bypassable prerequisite for any native owner exception to AI policy.
    # Requiring the publisher alone is unsafe: GitHub accepts skipped checks.
    if: always()
    needs: [analyze, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful analysis and validated current-SHA publication
        env:
          ANALYSIS: ${{ needs.analyze.result }}
          PUBLICATION: ${{ needs.publish.result }}
        run: |
          if [ "$ANALYSIS" != success ] || [ "$PUBLICATION" != success ]; then
            echo "::error::Review integrity not satisfied: missing, skipped, cancelled, stale, invalid or failed review. Owner policy bypass must not bypass this check."
            exit 1
          fi

  review-policy:
    # Never skip this gate for a skipped/missing/failed review: GitHub treats
    # skipped and neutral required checks as passing.
    if: always()
    needs: [analyze, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require complete review without blocking findings or human-inspection requirements
        env:
          ANALYSIS: ${{ needs.analyze.result }}
          PUBLICATION: ${{ needs.publish.result }}
          APPROVED: ${{ needs.publish.outputs.approved }}
        run: |
          if [ "$ANALYSIS" != success ] || [ "$PUBLICATION" != success ] || [ "$APPROVED" != true ]; then
            echo "::error::Review policy not satisfied: incomplete coverage, human inspection, blocking findings, or failed/missing execution. See review-execution summary. This is not merge approval."
            exit 1
          fi
